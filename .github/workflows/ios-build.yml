name: Flutter quality and iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_id:
        description: Nombre opcional del artefacto
        required: false
        type: string

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        env:
          REQUESTED_BUILD_ID: ${{ inputs.build_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          BUILD_ID="${REQUESTED_BUILD_ID:-flowstock-${RUN_NUMBER}}"
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa
          zip -qry "${BUILD_ID}.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: flowstock-ios-${{ github.run_number }}
          path: build/ipa/*.ipa
          retention-days: 14
          if-no-files-found: error
